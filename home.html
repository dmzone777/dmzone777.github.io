<!DOCTYPE html>
<html>
<head>
<title>FF Pro Dashboard</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#0f2027;
    color:white;
    text-align:center;
}
header{
    background:black;
    padding:15px;
}
button{
    padding:10px;
    margin:10px;
    border:none;
    background:#00ffcc;
    cursor:pointer;
    border-radius:8px;
}
.codes{
    background:#1c1c1c;
    margin:20px;
    padding:15px;
    border-radius:10px;
}
</style>

</head>

<body>

<header>
    <h2>🔥 FF PRO PANEL</h2>
</header>

<h3 id="user"></h3>

<button onclick="goRedeem()">Redeem Checker</button>
<button onclick="goTour()">Tournaments</button>
<button onclick="logout()">Logout</button>

<div class="codes">
    <h3>🎁 Latest Redeem Codes</h3>
    <p id="codesList"></p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtJzjzNsBvMVj6bOfByWzX21hxSAyLYVQ",
  authDomain: "mini-instagram-95485.firebaseapp.com",
  projectId: "mini-instagram-95485",
  appId: "1:426906615408:web:1ba85f1d00b9c09e083eb5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location = "index.html";
  } else {
    document.getElementById("user").innerHTML = "Welcome " + user.email;
  }
});

// 🔥 Latest Codes (dynamic style)
let codes = [
  "FF6YH3BFD7VT",
  "B1RK7C5ZL8YT",
  "4ST1ZTBZBRP9",
  "UPQ7X5NMJ64V"
];

document.getElementById("codesList").innerHTML = codes.join("<br>");

window.logout = function(){
  signOut(auth).then(()=> window.location="index.html");
}

window.goRedeem = function(){
  window.location="redeem.html";
}

window.goTour = function(){
  window.location="tournament.html";
}

</script>

</body>
</html>
