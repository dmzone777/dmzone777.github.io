<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Effects Panel</title>

<link rel="stylesheet" href="style.css">

<style>
.panel{
    background:#0f172a;
    padding:15px;
    border-radius:12px;
    margin:15px;
}

label{
    display:block;
    margin-top:10px;
}
</style>

</head>

<body>

<h2>🎨 Effects Panel</h2>

<video id="videoPreview" controls></video>

<div class="panel">

<label>Brightness</label>
<input type="range" id="brightness" min="50" max="150" value="100">

<label>Contrast</label>
<input type="range" id="contrast" min="50" max="150" value="100">

<label>Saturation</label>
<input type="range" id="saturation" min="0" max="200" value="100">

<label>Blur</label>
<input type="range" id="blur" min="0" max="10" value="0">

</div>

<button onclick="applyEffects()">Apply</button>
<button onclick="resetEffects()">Reset</button>

<br><br>

<button onclick="goBack()">⬅ Back</button>
<button onclick="goNext()">Next ➡ Audio</button>

<script src="script.js"></script>

<script>

// 🔥 Live Preview (auto apply)
["brightness","contrast","saturation","blur"].forEach(id=>{
    document.getElementById(id).addEventListener("input", applyEffects);
});

// Reset Effects
function resetEffects(){
    brightness.value = 100;
    contrast.value = 100;
    saturation.value = 100;
    blur.value = 0;
    applyEffects();
}

// Navigation
function goNext(){
    let saved = localStorage.getItem("video");
    if(!saved){
        alert("⚠️ Video missing!");
        return;
    }
    window.location.href = "audio.html";
}

function goBack(){
    window.location.href = "index.html";
}

</script>

</body>
</html>
