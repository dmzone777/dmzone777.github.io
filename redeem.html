<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Control</title>

<link rel="stylesheet" href="style.css">

<style>
.panel{
    background:#0f172a;
    padding:15px;
    border-radius:12px;
    margin:15px;
}
label{
    display:block;
    margin-top:10px;
}
</style>

</head>

<body>

<h2>🔊 Audio Control</h2>

<video id="videoPreview" controls></video>

<div class="panel">

<label>Volume</label>
<input type="range" id="volume" min="0" max="1" step="0.1" value="1">

<label>Playback Speed</label>
<div>
    <button onclick="setSpeed(0.5)">0.5x</button>
    <button onclick="setSpeed(1)">1x</button>
    <button onclick="setSpeed(2)">2x</button>
</div>

</div>

<button onclick="resetAudio()">Reset</button>

<br><br>

<button onclick="goBack()">⬅ Back</button>
<button onclick="goNext()">Next ➡ Tools</button>

<script src="script.js"></script>

<script>

// 🎯 Live Volume Control
let vol = document.getElementById("volume");
vol.addEventListener("input", ()=>{
    if(video) video.volume = vol.value;
});

// 🔄 Reset Audio
function resetAudio(){
    vol.value = 1;
    if(video){
        video.volume = 1;
        video.playbackRate = 1;
    }
}

// ⚠️ Safe Reverse (fallback)
function reverseVideo(){
    alert("⚠️ Reverse full support nahi hota browser me.\nPreview ke liye speed use karo.");
}

// Navigation
function goNext(){
    let saved = localStorage.getItem("video");
    if(!saved){
        alert("⚠️ Video missing!");
        return;
    }
    window.location.href = "tools.html";
}

function goBack(){
    window.location.href = "effects.html";
}

</script>

</body>
</html>
