<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Editor - Upload</title>

<link rel="stylesheet" href="style.css">

<style>
.upload-box{
    border:2px dashed #38bdf8;
    padding:20px;
    border-radius:12px;
    margin:20px;
}

input[type="file"]{
    margin-top:10px;
}

.note{
    font-size:12px;
    color:#94a3b8;
}
</style>

</head>

<body>

<h2>🎬 Upload Your Video</h2>

<div class="upload-box">
    <p>Select a video file</p>
    <input type="file" id="videoInput" accept="video/*">
    <p class="note">Supported: MP4, WebM (browser dependent)</p>
</div>

<video id="videoPreview" controls></video>

<br><br>

<button id="nextBtn">Next ➡ Effects</button>

<script src="script.js"></script>

<script>
// Next button validation
document.getElementById("nextBtn").addEventListener("click", ()=>{
    let saved = localStorage.getItem("video");

    if(!saved){
        alert("⚠️ Pehle video upload karo!");
        return;
    }

    window.location.href = "effects.html";
});
</script>

</body>
</html>
