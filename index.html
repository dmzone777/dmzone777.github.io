<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Editor - Upload</title>

<style>
body{
    font-family:sans-serif;
    background:#020617;
    color:white;
    text-align:center;
}

.upload-box{
    border:2px dashed #38bdf8;
    padding:20px;
    border-radius:12px;
    margin:20px;
}

video{
    width:90%;
    max-width:420px;
    margin-top:15px;
    border-radius:12px;
}

button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:#38bdf8;
    font-weight:bold;
}
</style>

</head>

<body>

<h2>🎬 Upload Your Video</h2>

<div class="upload-box">
    <p>Select a video file</p>
    <input type="file" id="videoInput" accept="video/*">
</div>

<video id="videoPreview" controls></video>

<br><br>

<button id="nextBtn">Next ➡ Effects</button>

<script>

let video = document.getElementById("videoPreview");
let input = document.getElementById("videoInput");

// 🔥 LOAD SAVED VIDEO
window.onload = () => {
    let saved = localStorage.getItem("videoData");
    if(saved){
        video.src = saved;
    }
};

// 🔥 UPLOAD FIX (BASE64)
input.addEventListener("change", function(e){
    let file = e.target.files[0];

    if(file){
        let reader = new FileReader();

        reader.onload = function(event){
            let base64 = event.target.result;

            // Save
            localStorage.setItem("videoData", base64);

            // Show preview
            video.src = base64;
            video.load();
            video.play();
        };

        reader.readAsDataURL(file);
    }
});

// 🔥 NEXT BUTTON FIX
document.getElementById("nextBtn").addEventListener("click", ()=>{
    let saved = localStorage.getItem("videoData");

    if(!saved){
        alert("⚠️ Pehle video upload karo!");
        return;
    }

    window.location.href = "effects.html";
});

</script>

</body>
</html>
