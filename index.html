<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Pro Login</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.box{
    background:rgba(0,0,0,0.7);
    padding:30px;
    border-radius:15px;
    text-align:center;
    width:300px;
    box-shadow:0 0 20px #00ffcc;
}

h2{
    margin-bottom:20px;
    color:#00ffcc;
}

input{
    width:90%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    width:95%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00ffcc;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#00ccaa;
}

.msg{
    margin-top:10px;
    font-size:14px;
}
</style>

</head>

<body>

<div class="box">
    <h2>🔥 FF PRO LOGIN</h2>

    <input type="email" id="email" placeholder="Enter Email">
    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Signup</button>

    <div class="msg" id="msg"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtJzjzNsBvMVj6bOfByWzX21hxSAyLYVQ",
  authDomain: "mini-instagram-95485.firebaseapp.com",
  projectId: "mini-instagram-95485",
  storageBucket: "mini-instagram-95485.firebasestorage.app",
  messagingSenderId: "426906615408",
  appId: "1:426906615408:web:1ba85f1d00b9c09e083eb5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const msg = document.getElementById("msg");

window.signup = function(){
    createUserWithEmailAndPassword(auth, email.value, password.value)
    .then(()=>{
        msg.innerHTML = "✅ Signup Success! Now login.";
        msg.style.color = "lightgreen";
    })
    .catch(e=>{
        msg.innerHTML = e.message;
        msg.style.color = "red";
    });
}

window.login = function(){
    signInWithEmailAndPassword(auth, email.value, password.value)
    .then(()=>{
        msg.innerHTML = "✅ Login Success!";
        msg.style.color = "lightgreen";
        setTimeout(()=>{ window.location="home.html"; },1000);
    })
    .catch(e=>{
        msg.innerHTML = e.message;
        msg.style.color = "red";
    });
}

</script>

</body>
</html>
