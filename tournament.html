<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools</title>

<link rel="stylesheet" href="style.css">

<style>
.panel{
    background:#0f172a;
    padding:15px;
    border-radius:12px;
    margin:15px;
}
button{
    margin:5px;
}
</style>

</head>

<body>

<h2>🛠️ Tools Panel</h2>

<video id="videoPreview" controls></video>

<div class="panel">

<h3>Transform</h3>
<button onclick="rotateVideo()">Rotate ⟳</button>
<button onclick="flipVideo()">Flip ⇋</button>
<button onclick="resetTransform()">Reset</button>

</div>

<div class="panel">

<h3>Trim</h3>
<button onclick="trimVideo()">✂️ Trim Video</button>

</div>

<br>

<button onclick="goBack()">⬅ Back</button>
<button onclick="goNext()">Next ➡ Export</button>

<script src="script.js"></script>

<script>

// 🔄 Reset Transform
function resetTransform(){
    if(video){
        video.style.transform = "rotate(0deg) scaleX(1)";
    }
}

// ✂️ Safe Trim (preview based)
function trimVideo(){
    let start = prompt("Enter start time (seconds):");
    let end = prompt("Enter end time (seconds):");

    start = parseFloat(start);
    end = parseFloat(end);

    if(isNaN(start) || isNaN(end) || start < 0 || end <= start){
        alert("⚠️ Invalid input!");
        return;
    }

    if(video){
        video.currentTime = start;

        let interval = setInterval(()=>{
            if(video.currentTime >= end){
                video.pause();
                clearInterval(interval);
            }
        },200);
    }
}

// Navigation
function goNext(){
    let saved = localStorage.getItem("video");
    if(!saved){
        alert("⚠️ Video missing!");
        return;
    }
    window.location.href = "export.html";
}

function goBack(){
    window.location.href = "audio.html";
}

</script>

</body>
</html>
